<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="icon-clip">
      <rect width="64" height="64" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#icon-clip)">
    <!-- Base Branca (forma os cortes curvos entre o cinzento e o vermelho) -->
    <rect width="64" height="64" fill="#FFFFFF" />

    <!-- Bloco Superior Cinzento com a curva principal -->
    <path d="M0 0H64V36C52 50 40 48 28 32C18 19 8 18 0 23V0Z" fill="#8E9093" />

    <!-- Friso Branco Superior Esquerdo (detalhe da onda no cinzento) -->
    <path d="M0 15C7 11 16 11 23 15C15 13 7 15 0 20V15Z" fill="#FFFFFF" />

    <!-- Onda Principal Vermelha na Base -->
    <path d="M0 44C9 31 19 23 31 37C43 51 54 50 64 41V64H0V44Z" fill="#E31B23" />

    <!-- Friso Branco Interno na Onda Vermelha -->
    <path d="M0 56C9 41 19 31 32 41C21 36 11 45 0 62V56Z" fill="#FFFFFF" />
  </g>

  <!-- Borda subtil para destacar em abas claras ou escuras -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" stroke="#000000" stroke-opacity="0.1" />
</svg>